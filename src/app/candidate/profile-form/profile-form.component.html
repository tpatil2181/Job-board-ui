<div class="overlay" *ngIf="visible" (click)="onOverlayClick($event)">
  <div class="form-card">

    <div class="form-header">
      <h3>Edit Profile</h3>
      <button class="close-btn" (click)="onClose()">✕</button>
    </div>

    <form #profileForm="ngForm" (ngSubmit)="onSave(profileForm)" class="form-body">

      <div class="photo-group">
        <div class="photo-avatar">
          <img *ngIf="imagePreviewUrl" [src]="imagePreviewUrl" alt="Profile photo">
          <span *ngIf="!imagePreviewUrl">{{ initials }}</span>

          <label class="photo-camera" for="profilePhotoInput">📷</label>
          <input
            id="profilePhotoInput"
            type="file"
            accept="image/*"
            class="photo-input-hidden"
            (change)="onPhotoSelected($event)">
        </div>
        <label class="photo-change-label" for="profilePhotoInput">Change photo</label>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label>First Name <span class="req">*</span></label>
          <input type="text" name="firstName" [(ngModel)]="form.firstName" required
                 placeholder="Ex: Aditi">
        </div>
        <div class="form-group half">
          <label>Last Name <span class="req">*</span></label>
          <input type="text" name="lastName" [(ngModel)]="form.lastName" required
                 placeholder="Ex: Sharma">
        </div>
      </div>

       <div class="form-group">
        <label>Candidate Title</label>
        <input type="text" name="candidateTitle" [(ngModel)]="form.candidateTitle"
               placeholder="Ex: Senior Product Designer">
      </div>

      <div class="form-group">
        <label>Contact</label>
        <input type="number" name="mobileno" [(ngModel)]="form.mobNo"
               placeholder="Ex: +91 0123456789">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="text" name="email" [(ngModel)]="form.contactEmail"
               placeholder="Ex: abc@gmail.com">
      </div>


      <div class="form-group">
        <label>About</label>
        <textarea name="candidateAbout" [(ngModel)]="form.candidateAbout" maxlength="500" rows="4"
                  placeholder="Tell recruiters about your experience, skills, and what you're looking for."></textarea>
        <div class="char-count">{{ form.candidateAbout?.length || 0 }} / {{ aboutMaxLength }}</div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="onClose()">Cancel</button>
        <button type="submit" class="btn-save" [disabled]="profileForm.invalid">
          Save Changes
        </button>
      </div>

    </form>

  </div>
</div>
