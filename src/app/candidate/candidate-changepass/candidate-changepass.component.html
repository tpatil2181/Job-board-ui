<div class="container">
  <div class="card">

    <h2>Change Password</h2>
    <p class="subtitle">Update your account password. Make sure it's at least 8 characters and hard to guess.</p>

    <form (ngSubmit)="submit()" #form="ngForm">

      <div class="form-group">
        <label>Current Password</label>
        <input type="password"
               name="currentPassword"
               [(ngModel)]="changePass.currentPass"
               required
               placeholder="Enter current password">
      </div>

      <div class="form-group">
        <label>New Password</label>
        <input type="password"
               name="newPassword"
               [(ngModel)]="changePass.newPass"
               required
               placeholder="Enter new password">
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password"
               name="confirmPassword"
               [(ngModel)]="confirmpass"
               required
               placeholder="Re-enter new password">
      </div>

      <button type="submit" [disabled]="form.invalid">
        Update Password
      </button>

    </form>

  </div>
</div>
