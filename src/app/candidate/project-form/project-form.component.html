<div class="overlay" *ngIf="visible" (click)="onOverlayClick($event)">
  <div class="form-card">

    <div class="form-header">
      <h3>{{ isEditMode ? 'Edit Project' : 'Add Project' }}</h3>
      <button class="close-btn" (click)="onClose()">✕</button>
    </div>

    <form #projForm="ngForm" (ngSubmit)="onSave(projForm)" class="form-body">

      <div class="form-group">
        <label>Project Title <span class="req">*</span></label>
        <input type="text" name="title" [(ngModel)]="form.ProjectTitle" required
               placeholder="Ex: Checkout Redesign — Zeta Pay">
      </div>

      <div class="form-group">
        <label>Your Role</label>
        <input type="text" name="role" [(ngModel)]="form.role"
               placeholder="Ex: Lead Product Designer">
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label>Start Date</label>
          <div class="inline-selects">
            <select name="startMonth" [(ngModel)]="form.smonth">
              <option value="" disabled selected>Month</option>
              <option *ngFor="let m of months" [value]="m">{{ m }}</option>
            </select>
            <select name="startYear" [(ngModel)]="form.syear">
              <option value="" disabled selected>Year</option>
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
        </div>
        <div class="form-group half">
          <label>End Date</label>
          <div class="inline-selects">
            <select name="endMonth" [(ngModel)]="form.emonth" [disabled]="form.isOngoing">
              <option value="" disabled selected>Month</option>
              <option *ngFor="let m of months" [value]="m">{{ m }}</option>
            </select>
            <select name="endYear" [(ngModel)]="form.eyear" [disabled]="form.isOngoing">
              <option value="" disabled selected>Year</option>
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
        </div>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="ongoing" name="ongoing" [(ngModel)]="form.isOngoing">
        <label for="ongoing">This project is ongoing</label>
      </div>

      <div class="form-group">
        <label>Description <span class="req">*</span></label>
        <textarea name="description" rows="3" [(ngModel)]="form.discription" required
                  placeholder="Describe what you built and the impact it had"></textarea>
      </div>

      <div class="form-group">
        <label>Project / Case Study URL</label>
        <input type="url" name="projectUrl" [(ngModel)]="form.casestudyurl" placeholder="https://...">
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="onClose()">Cancel</button>
        <button type="submit" class="btn-save" [disabled]="projForm.invalid">
          {{ isEditMode ? 'Save Changes' : 'Add Project' }}
        </button>
      </div>

    </form>

  </div>
</div>
