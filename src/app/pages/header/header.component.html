<!-- app/shared/components/header/header.component.html -->

<head>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<!-- ===== NAVBAR ===== -->
<nav class="navbar">
  <div class="nav-inner">

    <a [routerLink]="['/']" class="logo">Hire<span>Flow</span></a>

    <ul class="nav-links">
      <li><a [routerLink]="['']" routerLinkActive="active">Find Jobs</a></li>
      <li><a [routerLink]="['/companies']" routerLinkActive="active">Companies</a></li>
      <!-- <a [routerLink]="['/about']" routerLinkActive="active">How It Works</a> -->
      <!-- <a [routerLink]="['/about']" routerLinkActive="active">Career Advice</a> -->
    </ul>
    <div class="nav-actions">
      <div *ngIf="!isLoggedIn" class="nav-actions">
        <button (click)="goToLogin()" class="btn btn-outline">Sign In</button>
        <button (click)="goToRegister()" class="btn btn-outline">Sign Up</button>

        <!-- <<button (click)="goToLogin()" class="btn btn-outline">Sign In</button>
<button (click)="goToRegister()" class="btn btn-outline">Sign Up</button> -->

        <!-- <span style="margin: 0 10px; color: #ccc;">|</span> -->

        <span class="nav-divider"></span>

        <div class="profile-dropdown">
          <button class="btn btn-outline" (click)="isMenuOpen = !isMenuOpen"
            style="border: none; background: transparent; cursor: pointer; font-size: medium;",>
            Employer
          </button>

          <div class="dropdown-menu" *ngIf="isMenuOpen">
            <button class="menu-item" type="button" (click)="goToCompanyLogin()">
              Company Login
            </button>
            <button class="menu-item" type="button" (click)="goToCompanyRegister()">
              Company Registration
            </button>
          </div>
        </div>
        <!-- <button (click)="goToCompanyLogin()" class="btn btn-outline">Sign In</button>
        <button (click)="goToCompanyRegister()" class="btn btn-outline">Sign Up</button> -->
      </div>
      <div *ngIf="isLoggedIn" class="nav-actions">

        <!-- Notification Bell -->
        <div class="notification-wrapper">
          <button class="notification-btn">

            <span class="material-symbols-outlined notification-icon">
              notifications
            </span>

            <span class="notification-count">12</span>

          </button>
        </div>

        <div class="profile-dropdown">

          <button class="profile-btn" (click)="isMenuOpen = !isMenuOpen">
            <span class="profile-name">
              {{ candidate?.firstName || 'User' }}
            </span>

            <span class="arrow">
              ▼
            </span>
          </button>

          <div class="dropdown-menu" *ngIf="isMenuOpen">
            <button *ngFor="let item of menuItems" class="menu-item" type="button" (click)="onMenuClick(item.action)">
              <span class="menu-icon">{{ item.icon }}</span>
              <span>{{ item.label }}</span>
            </button>
          </div>

        </div>

      </div>
      <!-- <button (click)="goTologin()" class="btn btn-outline">Sign In</button>
                  <button (click)="goToRegister()" class="btn btn-outline">Sign Up</button>
                  <a href="#" class="btn btn-solid">Post a Job</a> -->
    </div>

  </div>
</nav>
