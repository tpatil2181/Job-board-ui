<div class="posted-jobs-container">

<h2>Posted Jobs</h2>

<!-- Filter Bar -->

<div class="filter-bar">

<div class="filter-group">
  <label>Find Posted Jobs</label>

  <select [(ngModel)]="selectedStatus">
    <option value="">All</option>
    <option value="OPEN">Open</option>
    <option value="CLOSED">Closed</option>
    <option value="PAUSED">Paused</option>
  </select>
</div>

<button class="search-btn" (click)="filterPostedJobs()">
  Search
</button>

</div>

<!-- Jobs Table -->

<div class="job-table">

<table>

  <thead>
    <tr>
      <th class="title-column">Job Title</th>
      <th class="date-column">Post Date</th>
      <th class="status-column">Status</th>
      <th class="action-column">Action</th>
    </tr>
  </thead>

  <tbody>

    <tr *ngFor="let job of (filteredPostedJobs.slice().reverse()); trackBy: trackByJob">

      <!-- Job Title -->
      <td class="job-title">
        {{ job.jobTitle }}
      </td>

      <!-- Post Date -->
      <td>
        {{ job.datePosted | dateFormatePipe }}
      </td>

      <!-- Status -->
      <td>
        <select
          class="status-select"
          [(ngModel)]="job.status">

          <option value="OPEN">Open</option>
          <option value="CLOSED">Closed</option>
          <option value="PAUSED">Paused</option>

        </select>
      </td>

      <!-- Action -->
      <td>
        <button
          class="update-btn"
          (click)="updateJob(job.jobId, job.status)">
          Update
        </button>
      </td>

    </tr>

    <!-- Empty State -->
    <tr *ngIf="filteredPostedJobs.length === 0">

      <td colspan="4" class="empty-row">
        No posted jobs found.
      </td>

    </tr>

  </tbody>

</table>

</div>

</div>
